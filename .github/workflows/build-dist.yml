name: Compilar dist de la extensión

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

# Si llegan dos pushes seguidos, solo se compila el último (evita dos compilaciones pisándose al publicar dist/)
concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publicar dist/ en el repo
        run: |
          git config user.name "kairos-build"
          git config user.email "kairosautomation.ia@gmail.com"
          git add -f dist package-lock.json
          if git diff --cached --quiet; then echo "dist sin cambios"; exit 0; fi
          git commit -m "build: actualizar dist/ [skip ci]"
          git push
